# PS5 Management Server - Python Project Configuration
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-management-server"
version = "1.0.0"
description = "A comprehensive web-based management service for jailbroken PS5 consoles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PS5 Management Team", email = "admin@example.com"}
]
keywords = ["ps5", "jailbreak", "management", "ftp", "games", "torrent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    # Core Web Framework
    "flask==3.0.0",
    "flask-socketio==5.3.6",
    "flask-cors==4.0.1",
    "gunicorn==21.2.0",
    
    # Database
    "sqlalchemy==2.0.32",
    "alembic==1.13.1",
    
    # FTP Client
    "pyftpdlib==1.5.7",
    
    # Torrent Clients
    "python-qbittorrent==0.4.2",
    "transmission-rpc==4.3.1",
    
    # HTTP Requests
    "requests>=2.33.1,<3.0.0",
    "httpx==0.28.1",
    "aiohttp==3.14.5",
    
    # PS5 Specific
    "psnawp==3.1.0",
    
    # Utilities
    "python-dotenv==1.0.0",
    "psutil==5.9.6",
    "watchdog==3.0.0",
    
    # Config
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "flake8==7.0.0",
    "isort==5.13.2",
    "pre-commit==3.6.0",
]
prod = [
    "uvicorn==0.30.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.flake8]
max-line-length = 120
extend-ignore = "E203,W503"
exclude = ".git,__pycache__,data,logs,.venv,venv,env,build,dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.alembic]
script_location = "migrations"